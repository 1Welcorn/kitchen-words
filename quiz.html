<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Final - Kitchen Match</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --success: #10b981;
            --danger: #f43f5e;
            --bg: #f8fafc;
            --card: #ffffff;
            --text-dark: #1e293b;
            --text-light: #64748b;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background:
                radial-gradient(circle at 20% 20%, #e0e7ff 0%, transparent 45%),
                radial-gradient(circle at 80% 0%, #c7d2fe 0%, transparent 35%),
                linear-gradient(135deg, #eef2ff 0%, #e2e8f0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1.25rem;
            color: var(--text-dark);
        }

        .main-container {
            width: 90%;
            max-width: 480px;
        }

        .quiz-card {
            background: #ffffff;
            border-radius: 3rem;
            padding: 3rem;
            box-shadow:
                0 30px 60px rgba(99, 102, 241, 0.12),
                0 4px 12px rgba(0, 0, 0, 0.03);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 1);
            animation: cardEnter 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .quiz-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.35rem 0.75rem;
            border-radius: 999px;
            background: #eef2ff;
            color: var(--primary-dark);
            border: 1px solid #c7d2fe;
            font-weight: 700;
            font-size: 0.78rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        .progress-container {
            width: 100%;
            height: 10px;
            background: #f1f5f9;
            border-radius: 20px;
            margin-bottom: 2rem;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #6366f1 0%, #818cf8 100%);
            transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .header h2 {
            margin: 0;
            font-weight: 800;
            font-size: 1.8rem;
            color: var(--primary);
            letter-spacing: -0.02em;
        }

        .header p {
            margin: 0.5rem 0 1.5rem 0;
            color: var(--text-light);
            font-size: 1.02rem;
        }

        .image-wrapper {
            background: linear-gradient(145deg, #f8fafc 0%, #eef2ff 100%);
            border-radius: 2.5rem;
            padding: 2.5rem;
            margin-bottom: 2rem;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid #e2e8f0;
        }

        .image-wrapper:hover {
            transform: translateY(-4px) scale(1.01);
            border-color: var(--primary);
            box-shadow: 0 12px 30px rgba(99, 102, 241, 0.14);
        }

        .image-wrapper img {
            width: 130px;
            height: 130px;
            object-fit: contain;
        }

        .audio-btn {
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 15px rgba(99, 102, 241, 0.3);
            cursor: pointer;
        }

        .options-grid {
            display: grid;
            gap: 0.9rem;
            margin-top: 1.2rem;
        }

        .btn-option {
            background: #ffffff;
            border: 1.5px solid #eef2ff;
            padding: 1.4rem;
            border-radius: 1.5rem;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 6px rgba(15, 23, 42, 0.02);
            animation: optionEnter 0.4s ease both;
        }

        .options-grid .btn-option:nth-child(2) { animation-delay: 0.06s; }
        .options-grid .btn-option:nth-child(3) { animation-delay: 0.12s; }

        .btn-option:hover:not(:disabled) {
            border-color: var(--primary);
            background: linear-gradient(180deg, #ffffff 0%, #eef2ff 100%);
            transform: translateY(-2px);
            box-shadow: 0 10px 18px rgba(99, 102, 241, 0.2);
        }

        .btn-option:active:not(:disabled) {
            transform: translateY(0);
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.14);
        }

        .btn-option:disabled {
            opacity: 0.92;
            cursor: not-allowed;
        }

        .btn-option.correct {
            background: var(--success);
            border-color: var(--success);
            color: white;
            animation: bounce 0.5s;
        }

        .btn-option.wrong {
            background: var(--danger);
            border-color: var(--danger);
            color: white;
            animation: shake 0.4s;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .btn-restart {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            padding: 1.2rem;
            border-radius: 1.5rem;
            font-size: 1.2rem;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            margin-top: 1.5rem;
            box-shadow: 0 12px 22px rgba(79, 70, 229, 0.28);
        }

        .hidden { display: none; }

        @keyframes cardEnter {
            from { opacity: 0; transform: translateY(10px) scale(0.99); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes optionEnter {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 520px) {
            .quiz-card {
                padding: 1.4rem;
                border-radius: 1.4rem;
            }

            .header h2 { font-size: 1.45rem; }
            .header p { font-size: 0.95rem; margin-bottom: 1.1rem; }

            .image-wrapper {
                padding: 1.4rem;
                border-radius: 1.3rem;
                margin-bottom: 1.4rem;
            }

            .image-wrapper img {
                width: 110px;
                height: 110px;
            }

            .btn-option {
                padding: 1rem;
                font-size: 1.05rem;
                border-radius: 0.95rem;
            }
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="quiz-card">
        <div id="game-view">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <div class="quiz-badge" style="margin-bottom: 0;">Teste Final 🏆</div>
                <a href="index.html" style="background: #eef2ff; color: var(--primary-dark); padding: 0.35rem 0.75rem; border-radius: 999px; text-decoration: none; font-weight: 700; font-size: 0.78rem; border: 1px solid #c7d2fe; text-transform: uppercase; letter-spacing: 0.04em;">FASE 1 🖱️</a>
            </div>
            <div class="progress-container">
                <div class="progress-bar" id="progress"></div>
            </div>

            <div class="header">
                <h2>O que fazemos?</h2>
                <p>Ouça e escolha a ação correta</p>
            </div>

            <div class="image-wrapper" onclick="speakCurrent()">
                <img id="display-image" src="" alt="Object">
                <button class="audio-btn">🔊 Ouvir</button>
            </div>

            <div class="options-grid" id="options"></div>
        </div>

        <div id="result-view" class="hidden">
            <div style="font-size: 4rem;">✨</div>
            <h2 style="font-weight: 800; font-size: 2rem;">Teste Final Completo!</h2>
            <p id="score-text" style="color: var(--text-light); font-size: 1.2rem;"></p>
            <button class="btn-restart" onclick="restart()">Refazer Teste</button>
        </div>
    </div>
</div>

<script>
    const questions = [
        { img: "images/knife.png", word: "Knife", correct: "cut", options: ["cut", "drink", "open"] },
        { img: "images/cup.png", word: "Cup", correct: "drink", options: ["mix", "drink", "cook"] },
        { img: "images/fridge.png", word: "Fridge", correct: "open", options: ["open", "cut", "mix"] },
        { img: "images/spoon.png", word: "Spoon", correct: "mix", options: ["mix", "cook", "drink"] },
        { img: "images/pan.png", word: "Pan", correct: "cook", options: ["drink", "cook", "cut"] }
    ];

    function shuffle(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    let shuffledQuestions = shuffle(questions);
    let current = 0;
    let score = 0;
    let femaleEnglishVoice = null;

    // Motor de ├íudio otimizado para voz feminina nativa (US)
    function findBestVoice() {
        const voices = window.speechSynthesis.getVoices();
        // Ordem de prefer├¬ncia para vozes naturais e femininas de ingl├¬s americano
        femaleEnglishVoice = voices.find(v => v.name.includes('Samantha') || v.name.includes('Google US English') || v.name.includes('Natural') && v.lang.includes('en-US')) 
                           || voices.find(v => v.lang.includes('en-US'))
                           || voices.find(v => v.lang.includes('en'));
    }

    // Garante que as vozes foram carregadas
    window.speechSynthesis.onvoiceschanged = findBestVoice;
    findBestVoice();

    // Queue-based speak to avoid overlaps between utterances
    const _speechQueueQ = [];
    let _speechRunningQ = false;

    function _processSpeechQueueQ() {
        if (_speechQueueQ.length === 0) { _speechRunningQ = false; return; }
        _speechRunningQ = true;
        const { text, onEnd } = _speechQueueQ.shift();
        const msg = new SpeechSynthesisUtterance(text);
        const voices = window.speechSynthesis.getVoices();

        const isPT = /[áàâãéèêíïóôõöúç]/i.test(text) || /\b(Tente|mais|vez|Parabéns|acertou|Isso|mesmo|Muito|bem|Pronto|Fase|Teste|final)\b/i.test(text);

        if (isPT) {
            msg.lang = 'pt-BR';
            msg.voice = voices.find(v => v.lang === 'pt-BR') || voices.find(v => v.lang && v.lang.includes('pt')) || voices.find(v => (v.name||'').includes('Daniel') || (v.name||'').includes('Maria') || (v.name||'').includes('Luciana'));
            msg.rate = 1.0;
        } else {
            msg.lang = 'en-US';
            msg.voice = voices.find(v => (v.name||'').includes('Samantha') || (v.name||'').includes('Google US English') || ((v.name||'').includes('Natural') && v.lang && v.lang.includes('en-US'))) || voices.find(v => v.lang === 'en-US') || voices.find(v => v.lang && v.lang.includes('en'));
            msg.rate = 0.75;
        }

        msg.onend = () => { if (onEnd) onEnd(); setTimeout(_processSpeechQueueQ, 80); };
        window.speechSynthesis.speak(msg);
    }

    function speak(text, onEnd = null) {
        _speechQueueQ.push({ text, onEnd });
        if (!_speechRunningQ) _processSpeechQueueQ();
    }

    function speakCurrent() {
        speak(shuffledQuestions[current].word);
    }

    // ensure the floating audio button also triggers the speech
    const audioBtn = document.querySelector('.audio-btn');
    if (audioBtn) audioBtn.addEventListener('click', (e) => { e.stopPropagation(); speakCurrent(); });

    function load() {
        const q = shuffledQuestions[current];
        document.getElementById('display-image').src = q.img;
        document.getElementById('progress').style.width = `${(current / shuffledQuestions.length) * 100}%`;
        
        const grid = document.getElementById('options');
        grid.innerHTML = "";
        
        q.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn-option';
            btn.innerText = opt;
            btn.onclick = () => selectOption(opt, btn);
            grid.appendChild(btn);
        });
    }

    function selectOption(choice, btn) {
        const btns = document.querySelectorAll('.btn-option');
        btns.forEach(b => b.disabled = true);
        speak(choice, () => check(choice, btn));
    }

    function check(choice, btn) {
        const correct = shuffledQuestions[current].correct;
        const btns = document.querySelectorAll('.btn-option');

        if(choice === correct) {
            btn.classList.add('correct');
            score++;
            speak("Isso mesmo!", () => {
                setTimeout(() => {
                    current++;
                    if(current < shuffledQuestions.length) load();
                    else finish();
                }, 1000);
            });
        } else {
            btn.classList.add('wrong');
            const wrongMsg = Math.random() > 0.5 ? "Try again" : "Tente mais uma vez";
            speak(wrongMsg, () => {
                setTimeout(() => {
                    btn.classList.remove('wrong');
                    btns.forEach(b => b.disabled = false);
                }, 1000);
            });
        }
    }

    function finish() {
        document.getElementById('game-view').classList.add('hidden');
        document.getElementById('result-view').classList.remove('hidden');
        document.getElementById('score-text').innerText = `Você acertou ${score} de ${shuffledQuestions.length}!`;
        speak("Parabéns! Você fez um ótimo trabalho.");
    }

    function restart() {
        shuffledQuestions = shuffle(questions);
        current = 0; score = 0;
        document.getElementById('game-view').classList.remove('hidden');
        document.getElementById('result-view').classList.add('hidden');
        load();
    }

    load();
</script>

</body>
</html>
