<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cozinha em Inglês — Fase 2 (Ações)</title>
  <link rel="icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Caveat:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream:    #FFF6E5;
      --cream-2:  #FFEFD0;
      --ink:      #2B2541;
      --ink-soft: #5A5170;
      --teal:     #2EC4B6;
      --teal-dk:  #1FA89B;
      --coral:    #FF6B6B;
      --coral-dk: #E84F4F;
      --yellow:   #FFD166;
      --yellow-dk: #E8B848;
      --lilac:    #B8A1FF;
      --lilac-dk: #9A82E6;
      --green:    #06D6A0;
      --green-dk: #04B084;
      --red:      #EF476F;
      --shadow:   0 6px 0 rgba(43, 37, 65, 0.15);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Fredoka', system-ui, sans-serif;
      font-weight: 500;
      color: var(--ink);
      background:
        radial-gradient(circle at 80% 10%, rgba(255, 209, 102, 0.25), transparent 40%),
        radial-gradient(circle at 10% 90%, rgba(184, 161, 255, 0.22), transparent 40%),
        radial-gradient(circle at 50% 50%, var(--cream-2) 0%, var(--cream) 70%);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .deco {
      position: fixed;
      pointer-events: none;
      opacity: 0.45;
      z-index: 0;
    }
    .deco-1 { top: 12%; left: 6%; font-size: 36px; animation: float 8s ease-in-out infinite; }
    .deco-2 { top: 30%; right: 5%; font-size: 42px; animation: float 7s ease-in-out infinite -2s; }
    .deco-3 { bottom: 12%; left: 9%; font-size: 38px; animation: float 9s ease-in-out infinite -4s; }
    .deco-4 { bottom: 18%; right: 8%; font-size: 32px; animation: float 6.5s ease-in-out infinite -1s; }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-5deg); }
      50%      { transform: translateY(-16px) rotate(5deg); }
    }

    /* ============ TOP BAR ============ */
    .topbar {
      position: relative;
      z-index: 10;
      width: 100%;
      padding: 22px 40px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .home-btn {
      width: 48px; height: 48px;
      border: 3px solid var(--ink);
      background: #fff;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: var(--shadow);
      font-size: 22px;
      display: grid;
      place-items: center;
      text-decoration: none;
      color: var(--ink);
      transition: transform 0.08s, box-shadow 0.08s;
    }
    .home-btn:hover { transform: translateY(-2px); }
    .home-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(43,37,65,0.15); }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 18px;
      color: var(--ink);
    }
    .logo img { width: 48px; height: 48px; border-radius: 14px; box-shadow: var(--shadow); }
    .logo .title-stack { line-height: 1.05; }
    .logo .title-stack small {
      display: block;
      font-family: 'Caveat', cursive;
      font-size: 17px;
      color: var(--lilac-dk);
      font-weight: 700;
      transform: rotate(-2deg);
      margin-top: 2px;
    }

    .lives {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
      background: #fff;
      border: 3px solid var(--ink);
      border-radius: 999px;
      box-shadow: var(--shadow);
      font-weight: 700;
      font-size: 18px;
    }
    .heart {
      font-size: 22px;
      transition: filter 0.3s, opacity 0.3s, transform 0.3s;
      filter: drop-shadow(0 2px 0 rgba(232, 79, 79, 0.6));
    }
    .heart.lost {
      filter: grayscale(1);
      opacity: 0.3;
      transform: scale(0.85);
    }

    /* ============ PROGRESS BAR ============ */
    .progress-rail {
      position: relative;
      z-index: 2;
      width: 100%;
      padding: 0 40px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .progress-track {
      flex: 1;
      height: 16px;
      background: #fff;
      border: 3px solid var(--ink);
      border-radius: 999px;
      overflow: hidden;
      box-shadow: inset 0 3px 0 rgba(43,37,65,0.06);
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--lilac), var(--coral), var(--yellow));
      transition: width 0.5s cubic-bezier(.34, 1.56, .64, 1);
    }
    .progress-label {
      font-weight: 700;
      font-size: 15px;
      color: var(--ink-soft);
      white-space: nowrap;
    }

    /* ============ GAME LAYOUT LADO A LADO ============ */
    .game-layout {
      position: relative;
      z-index: 2;
      width: 100%;
      margin: 24px 0 40px;
      padding: 0 40px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      align-items: stretch;
    }

    /* Card do Quiz */
    .q-card {
      background: #fff;
      border: 5px solid var(--ink);
      border-radius: 36px;
      padding: 35px 30px;
      box-shadow: 0 10px 0 rgba(43, 37, 65, 0.18);
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .q-prompt {
      font-family: 'Caveat', cursive;
      font-weight: 700;
      font-size: 28px;
      color: var(--lilac-dk);
      margin-bottom: 6px;
      transform: rotate(-1deg);
    }
    .q-title {
      font-size: 24px;
      font-weight: 600;
      margin: 0 0 20px;
      color: var(--ink);
    }

    /* Image frame */
    .img-frame {
      width: 220px;
      height: 220px;
      margin: 0 auto 24px;
      background: var(--cream-2);
      border: 4px dashed var(--coral);
      border-radius: 32px;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 4px 0 rgba(43,37,65,0.06);
    }
    .img-frame img {
      max-width: 88%;
      max-height: 88%;
      object-fit: contain;
    }

    .audio-btn {
      position: absolute;
      bottom: 10px; right: 10px;
      width: 48px; height: 48px;
      border: 3px solid var(--ink);
      background: var(--yellow);
      border-radius: 50%;
      cursor: pointer;
      font-size: 22px;
      display: grid;
      place-items: center;
      box-shadow: 0 4px 0 var(--ink);
      transition: transform 0.08s, box-shadow 0.08s;
    }
    .audio-btn:hover { transform: translateY(-1px); }
    .audio-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--ink); }
    .audio-btn.playing { animation: pulse 0.8s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }

    /* Options grid */
    .options {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 8px;
      width: 100%;
    }

    .option {
      padding: 18px 16px;
      background: var(--cream);
      border: 4px solid var(--ink);
      border-radius: 20px;
      font-family: 'Fredoka';
      font-weight: 700;
      font-size: 20px;
      color: var(--ink);
      cursor: pointer;
      box-shadow: 0 5px 0 rgba(43,37,65,0.18);
      transition: transform 0.08s, box-shadow 0.08s, background 0.2s;
      letter-spacing: 0.5px;
      position: relative;
      overflow: hidden;
      text-align: left;
    }
    .option:hover:not(.disabled) { transform: translateY(-2px); box-shadow: 0 7px 0 rgba(43,37,65,0.18); background: #fff; }
    .option:active:not(.disabled) { transform: translateY(3px); box-shadow: 0 2px 0 rgba(43,37,65,0.18); }
    .option.correct { background: var(--green); color: #fff; border-color: var(--green-dk); box-shadow: 0 5px 0 var(--green-dk); }
    .option.wrong { background: var(--red); color: #fff; border-color: #C13959; box-shadow: 0 5px 0 #C13959; animation: shake 0.5s; }
    .option.disabled { cursor: default; }
    .option.faded { opacity: 0.45; }

    /* Banner Feedback */
    .feedback {
      margin-top: 18px; padding: 14px 18px;
      border: 3px solid var(--ink); border-radius: 18px;
      font-weight: 700; font-size: 17px; text-align: center;
      background: var(--cream-2); opacity: 0; transform: translateY(8px);
      transition: opacity 0.3s, transform 0.3s; min-height: 0;
    }
    .feedback.show { opacity: 1; transform: translateY(0); }
    .feedback.good { background: #DDFBED; border-color: var(--green-dk); }
    .feedback.bad  { background: #FFE0E5; border-color: var(--red); }

    /* Card Lateral de Sentenças Continuamente Visível */
    .reveal-panel {
      background: #fff;
      border: 5px solid var(--ink);
      border-radius: 36px;
      padding: 40px 30px;
      box-shadow: 0 10px 0 rgba(43, 37, 65, 0.18);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    .reveal-panel .sentence-box {
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: 32px;
      color: var(--ink);
      line-height: 1.5;
      margin-bottom: 20px;
    }

    /* Estilo padrão da lacuna vazia */
    .reveal-panel .blank-space {
      color: var(--ink-soft);
      letter-spacing: 2px;
      font-weight: 400;
    }

    /* Estilo animado quando o balão de resposta certa entra */
    .reveal-panel .completed-chunk {
      color: #fff;
      background-color: var(--coral-dk);
      padding: 4px 14px;
      border-radius: 14px;
      text-transform: uppercase;
      display: inline-block;
      box-shadow: 0 4px 0 var(--ink);
      letter-spacing: 0px;
      font-weight: 700;
      animation: popChunk 0.4s cubic-bezier(.34, 1.56, .64, 1) forwards;
    }
    @keyframes popChunk { from { transform: scale(0.8); } to { transform: scale(1); } }

    /* Tradução inicialmente oculta */
    .reveal-panel .translation-box {
      font-family: 'Fredoka', sans-serif;
      font-size: 24px;
      font-weight: 600;
      color: var(--ink-soft);
      margin-bottom: 30px;
      background: rgba(255, 255, 255, 0.4);
      padding: 14px 18px;
      border-radius: 18px;
      width: 100%;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .reveal-panel .translation-box.show {
      opacity: 1;
      transform: translateY(0);
      background: var(--cream-2);
      border: 3px dashed var(--yellow-dk);
    }

    /* Botão de ouvir inicialmente desativado/invisível */
    .reveal-panel .replay-mini {
      display: inline-block; padding: 12px 24px;
      background: #fff; border: 3px solid var(--ink); border-radius: 999px;
      font-family: 'Fredoka'; font-weight: 700; font-size: 18px; cursor: pointer; box-shadow: 0 4px 0 var(--ink);
      transition: opacity 0.3s, transform 0.08s;
      opacity: 0.3;
      pointer-events: none;
    }
    .reveal-panel .replay-mini.active {
      opacity: 1;
      pointer-events: auto;
    }
    .reveal-panel .replay-mini.active:hover { transform: translateY(-2px); }
    .reveal-panel .replay-mini.active:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }

    /* ============ END SCREEN ============ */
    .end-overlay { position: fixed; inset: 0; background: rgba(43, 37, 65, 0.7); backdrop-filter: blur(6px); z-index: 100; display: none; align-items: center; justify-content: center; padding: 20px; }
    .end-overlay.show { display: flex; }
    .end-card { background: var(--cream); border: 5px solid var(--ink); border-radius: 36px; padding: 36px 30px; max-width: 460px; width: 100%; text-align: center; box-shadow: 0 12px 0 rgba(43,37,65,0.25); }
    .end-card h2 { font-weight: 700; font-size: 36px; margin: 0 0 4px; color: var(--coral); }
    .stars-row { display: flex; justify-content: center; gap: 10px; margin: 10px 0 18px; font-size: 56px; }
    .stars-row span.empty { filter: grayscale(1); opacity: 0.35; }
    .btn-big { display: block; width: 100%; padding: 16px 22px; background: var(--coral); color: #fff; border: 4px solid var(--ink); border-radius: 22px; font-family: 'Fredoka'; font-weight: 700; font-size: 20px; cursor: pointer; box-shadow: 0 6px 0 var(--ink); text-decoration: none; text-align: center; }
    .btn-big.secondary { background: #fff; color: var(--ink); margin-top: 12px; }
    .confetti { position: fixed; width: 12px; height: 16px; top: -20px; z-index: 99; pointer-events: none; }

    @media (max-width: 768px) {
      .topbar, .progress-rail, .game-layout { padding: 0 16px; margin-top: 12px; }
      .game-layout { grid-template-columns: 1fr; gap: 20px; }
    }
  </style>
</head>
<body>
  <div class="deco deco-1">⭐</div>
  <div class="deco deco-2">🍳</div>
  <div class="deco deco-3">🥄</div>
  <div class="deco deco-4">🍴</div>

  <header class="topbar">
    <a class="home-btn" href="index.html" title="Voltar">←</a>
    <div class="logo">
      <img src="favicon.png" alt="">
      <div class="title-stack">
        <span>Cozinha em Inglês</span>
        <small>Fase 2 — Ações e Verbos</small>
      </div>
    </div>
    
    <div class="lives" id="lives">
      <span class="heart">❤️</span>
      <span class="heart">❤️</span>
      <span class="heart">❤️</span>
    </div>
  </header>

  <div class="progress-rail">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel">Pergunta 1/5</div>
  </header>

  <main class="game-layout">
    
    <!-- Coluna da Esquerda: O Quiz -->
    <section class="q-card" id="qCard">
      <div class="q-prompt">O que fazemos com isso?</div>
      <h1 class="q-title">Escolha a ação certa em inglês</h1>

      <div class="img-frame">
        <img id="qImage" src="images/fridge.png" alt="">
        <button class="audio-btn" id="audioBtn" title="Ouvir">🔊</button>
      </div>

      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
    </section>

    <!-- Coluna da Direita: Painel Continuo da Frase (Mecânica de Lacuna Inicial) -->
    <section class="reveal-panel">
      <div class="sentence-box" id="revealSentence"></div>
      <div class="translation-box" id="revealTranslation"></div>
      <div><button class="replay-mini" id="replayMini">🔊 Ouvir frase completa</button></div>
    </section>

  </main>

  <!-- End screen -->
  <div class="end-overlay" id="endOverlay">
    <div class="end-card">
      <h2 id="endTitle">Mandou bem!</h2>
      <div class="subtitle" id="endSubtitle">Você terminou a Fase 2!</div>
      <div class="stars-row" id="starsRow"></div>
      <div class="score-line">Acertos: <b id="finalScore">0/5</b></div>
      <button class="btn-big" id="restartBtn">Jogar de novo 🔁</button>
      <a class="btn-big secondary" href="index.html">Voltar ao início</a>
    </div>
  </div>

  <script>
    /* ---------- DATA ---------- */
    const questions = [
      { 
        word: 'CLEAN THE FRIDGE', 
        img: 'images/fridge.png', 
        options: ['CLEAN THE FRIDGE', 'BOIL THE WATER', 'BAKE A CAKE', 'SET THE TABLE'],
        sentencePre: 'I open and ',
        sentencePost: ' every weekend.',
        tr: 'Eu abro e limpo a geladeira todo fim de semana.'
      },
      { 
        word: 'STIR WITH THE SPOON',  
        img: 'images/spoon.png',  
        options: ['WASH THE DISHES', 'STIR WITH THE SPOON', 'CUT THE MEAT', 'SERVE THE FOOD'],
        sentencePre: 'Please, ',
        sentencePost: ' the hot soup.',
        tr: 'Por favor, mexa com a colher a sopa quente.'
      },
      { 
        word: 'CUT WITH THE KNIFE',  
        img: 'images/knife.png',  
        options: ['DRINK WATER', 'FRY AN EGG', 'CUT WITH THE KNIFE', 'MIX THE INGREDIENTS'],
        sentencePre: 'Be careful when you ',
        sentencePost: '!',
        tr: 'Tenha cuidado quando você cortar com a faca!'
      },
      { 
        word: 'COOK IN THE PAN',    
        img: 'images/pan.png',    
        options: ['OPEN THE DOOR', 'FREEZE THE ICE', 'COOK IN THE PAN', 'WASH YOUR HANDS'],
        sentencePre: 'We can ',
        sentencePost: ' on the stove.',
        tr: 'Nós podemos cozinhar na panela sobre o fogão.'
      },
      { 
        word: 'POUR INTO THE CUP',    
        img: 'images/cup.png',    
        options: ['POUR INTO THE CUP', 'CLEAN THE FLOOR', 'PEEL THE POTATO', 'HEAT THE FOOD'],
        sentencePre: 'Let’s ',
        sentencePost: ' some fresh orange juice.',
        tr: 'Vamos despejar no copo um pouco de suco de laranja fresco.'
      }
    ];

    /* ---------- STATE ---------- */
    const state = { idx: 0, score: 0, lives: 3, locked: false, attempts: 0 };

    /* ---------- DOM ---------- */
    const qImage = document.getElementById('qImage'); const audioBtn = document.getElementById('audioBtn'); const optionsEl = document.getElementById('options'); const feedback = document.getElementById('feedback'); const progressFill = document.getElementById('progressFill'); const progressLabel = document.getElementById('progressLabel'); const livesEl = document.getElementById('lives'); const endOverlay = document.getElementById('endOverlay'); const endTitle = document.getElementById('endTitle'); const endSubtitle = document.getElementById('endSubtitle'); const starsRow = document.getElementById('starsRow'); const finalScore = document.getElementById('finalScore'); const restartBtn = document.getElementById('restartBtn'); const qCard = document.getElementById('qCard'); 
    const revealSentence = document.getElementById('revealSentence'); const revealTranslation = document.getElementById('revealTranslation'); const replayMini = document.getElementById('replayMini');

    /* ---------- AUDIO ---------- */
    const speechQueue = []; let speechRunning = false;
    function processSpeechQueue() {
      if (speechQueue.length === 0) { speechRunning = false; return; }
      speechRunning = true;
      const { text, lang, onEnd } = speechQueue.shift();
      if (!('speechSynthesis' in window)) { speechRunning = false; if (onEnd) onEnd(); return; }
      const u = new SpeechSynthesisUtterance(text); const voices = window.speechSynthesis.getVoices();
      u.lang = lang === 'pt' ? 'pt-BR' : 'en-US'; u.rate = lang === 'pt' ? 1.0 : 0.80; 
      u.onend = () => { if (onEnd) onEnd(); setTimeout(processSpeechQueue, 80); };
      u.onerror = () => { if (onEnd) onEnd(); setTimeout(processSpeechQueue, 80); };
      window.speechSynthesis.speak(u);
    }
    function speak(text, lang = 'en', onEnd = null) { speechQueue.push({ text, lang, onEnd }); if (!speechRunning) processSpeechQueue(); }

    /* ---------- HELPERS ---------- */
    function shuffle(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
    function setFeedback(text, kind) { feedback.className = 'feedback show ' + (kind || ''); feedback.innerHTML = text; }
    function clearFeedback() { feedback.className = 'feedback'; feedback.innerHTML = ''; }
    function updateProgress() { const pct = ((state.idx) / questions.length) * 100; progressFill.style.width = pct + '%'; progressLabel.textContent = state.idx >= questions.length ? 'Concluído!' : `Pergunta ${state.idx + 1}/${questions.length}`; }
    function updateLives() { const hearts = livesEl.querySelectorAll('.heart'); hearts.forEach((h, i) => h.classList.toggle('lost', i >= state.lives)); }

    /* ---------- RENDER ---------- */
    function renderQuestion() {
      const q = questions[state.idx]; if (!q) { showEnd(); return; }
      state.attempts = 0; state.locked = false; clearFeedback(); 
      
      // Carrega a frase imediatamente exibindo a lacuna (_______)
      revealSentence.innerHTML = `${q.sentencePre}<span class="blank-space">_______</span>${q.sentencePost}`;
      
      // Reseta e esconde os elementos de resposta
      revealTranslation.className = 'translation-box';
      revealTranslation.textContent = '';
      replayMini.className = 'replay-mini';

      qCard.style.animation = 'none'; void qCard.offsetWidth; qCard.style.animation = 'cardIn 0.5s cubic-bezier(.34, 1.56, .64, 1)';
      qImage.src = q.img; optionsEl.innerHTML = '';
      shuffle(q.options).forEach(opt => {
        const btn = document.createElement('button'); btn.className = 'option'; btn.textContent = opt;
        btn.addEventListener('click', () => onOptionClick(opt, btn)); optionsEl.appendChild(btn);
      });
      updateProgress();
    }

    function playWord() { const q = questions[state.idx]; audioBtn.classList.add('playing'); speak(q.word, 'en', () => audioBtn.classList.remove('playing')); }
    audioBtn.addEventListener('click', playWord);
    
    replayMini.addEventListener('click', () => { 
      const q = questions[state.idx - 1] || questions[state.idx]; 
      if (q) speak(`${q.sentencePre} ${q.word} ${q.sentencePost}`, 'en');
    });

    /* ---------- ANSWER HANDLING ---------- */
    function onOptionClick(opt, btn) {
      if (state.locked) return; const q = questions[state.idx];
      speak(opt, 'en');
      if (opt === q.word) {
        state.locked = true; btn.classList.add('correct');
        optionsEl.querySelectorAll('.option').forEach(o => { o.classList.add('disabled'); if (o !== btn) o.classList.add('faded'); });
        if (state.attempts === 0) state.score += 1; else state.score += 0.5;
        setFeedback('Muito bem! 🎉', 'good');

        // Preenche dinamicamente a lacuna com a opção certa selecionada
        revealSentence.innerHTML = `${q.sentencePre}<span class="completed-chunk">${q.word}</span>${q.sentencePost}`;
        
        // Exibe a tradução e ativa o botão de repetição com efeitos suaves
        revealTranslation.textContent = q.tr;
        revealTranslation.classList.add('show');
        replayMini.classList.add('active');

        // Áudio da frase completa montada para consolidação do chunk
        setTimeout(() => {
          speak(`${q.sentencePre} ${q.word} ${q.sentencePost}`, 'en');
        }, 500);

        setTimeout(() => { state.idx++; renderQuestion(); }, 6500); 
      } else {
        state.attempts++; btn.classList.add('wrong', 'disabled'); state.lives = Math.max(0, state.lives - 1); updateLives();
        setFeedback('Quase! Tente outra 💪', 'bad'); speak('Try again', 'en');
        if (state.lives === 0) { state.locked = true; setTimeout(showEnd, 1100); }
      }
    }

    /* ---------- END SCREEN ---------- */
    function showEnd() {
      const total = questions.length; const score = state.score;
      let stars = 1; if (score >= total * 0.6) stars = 2; if (score >= total * 0.9) stars = 3;
      starsRow.innerHTML = '';
      for (let i = 0; i < 3; i++) { const s = document.createElement('span'); s.textContent = '⭐'; if (i >= stars) s.classList.add('empty'); starsRow.appendChild(s); }
      finalScore.textContent = `${score % 1 === 0 ? score : score.toFixed(1)}/${total}`;
      if (state.lives === 0 && score < total) { endTitle.textContent = 'Boa tentativa!'; endSubtitle.textContent = 'Quase lá — bora de novo?'; }
      else if (stars === 3) { endTitle.textContent = 'Incrível! 🎉'; endSubtitle.textContent = 'Você dominou as ações da cozinha!'; launchConfetti(); speak('Great job!', 'en'); }
      else if (stars === 2) { endTitle.textContent = 'Muito bem!'; endSubtitle.textContent = 'Você está aprendendo rápido!'; launchConfetti(); speak('Great job!', 'en'); }
      else { endTitle.textContent = 'Bom trabalho!'; endSubtitle.textContent = 'Vamos treinar mais um pouco?'; }
      endOverlay.classList.add('show'); progressFill.style.width = '100%'; progressLabel.textContent = 'Concluído!';
    }

    function launchConfetti() {
      const colors = ['#FF6B6B', '#FFD166', '#06D6A0', '#B8A1FF', '#2EC4B6'];
      for (let i = 0; i < 80; i++) {
        const c = document.createElement('div'); c.className = 'confetti'; c.style.left = Math.random() * 100 + 'vw'; c.style.background = colors[Math.floor(Math.random() * colors.length)];
        const dur = 2 + Math.random() * 2; c.style.animation = `confettiFall ${dur}s linear ${Math.random() * 0.6}s forwards`;
        document.body.appendChild(c); setTimeout(() => c.remove(), (dur + 1) * 1000);
      }
    }
    const styleEl = document.createElement('style'); styleEl.textContent = `@keyframes confettiFall { to { transform: translateY(110vh) rotate(720deg); opacity: 0.4; } }`; document.head.appendChild(styleEl);

    function restart() { state.idx = 0; state.score = 0; state.lives = 3; state.attempts = 0; state.locked = false; updateLives(); endOverlay.classList.remove('show'); renderQuestion(); }
    restartBtn.addEventListener('click', restart);

    renderQuestion();
  </script>
</body>
</html>
