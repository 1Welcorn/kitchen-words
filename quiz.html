<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Final - Kitchen Match</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            <!DOCTYPE html>
            <html lang="pt-br">
            <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <title>Kitchen Words - Aprendizado Divertido</title>
                <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700&display=swap" rel="stylesheet">
                <style>
                    :root {
                        --primary-color: #FFD166;   /* Amarelo vibrante (Principal) */
                        --secondary-color: #118AB2; /* Azul para botões */
                        --bg-color: #F8FDFF;        /* Fundo quase branco, azulado e limpo */
                        --card-bg: #FFFFFF;
                        --option-btn: #E0FBFC;      /* Azul clarinho para os botões de opção */
                        --correct-color: #06D6A0;   /* Verde sucesso */
                        --wrong-color: #EF476F;     /* Rosa/Vermelho erro */
                    }

                    body {
                        font-family: 'Lexend', sans-serif;
                        background-color: var(--bg-color);
                        color: var(--secondary-color);
                        display: flex;
                        flex-direction: column;
                        align-items: center;
                        justify-content: center;
                        min-height: 100vh;
                        margin: 0;
                        padding: 20px;
                    }

                    .header { text-align: center; margin-bottom: 20px; }
                    .header h1 { margin: 0; font-size: 2rem; color: var(--secondary-color); }

                    /* Estilo do Card Principal */
                    .game-container {
                        border: 8px solid #F0F4F8; /* Uma borda interna suave */
                        background: var(--card-bg);
                        border-radius: 50px;
                        padding: 40px;
                        box-shadow: 0 20px 40px rgba(17, 138, 178, 0.1);
                        display: flex;
                        flex-direction: column;
                        align-items: center;
                        max-width: 450px;
                        width: 100%;
                    }

                    .word-image {
                        width: 220px; height: 220px; background: #F8F9FA; margin-bottom: 25px;
                        border-radius: 30px; border: 5px dashed var(--primary-color);
                        display: flex; align-items: center; justify-content: center; font-size: 110px;
                    }

                    /* Ajuste no Texto da Palavra Principal */
                    .word-text {
                        font-size: 3.2rem; font-weight: 800; text-transform: uppercase; letter-spacing: 5px;
                        margin-bottom: 30px; color: var(--secondary-color); text-shadow: 2px 2px 0px rgba(0,0,0,0.05);
                    }

                    /* Grade de Opções */
                    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; }

                    /* Estilo dos Botões de Opção */
                    button {
                        padding: 20px 10px; font-family: 'Lexend', sans-serif; font-size: 1.4rem; font-weight: 700;
                        border: none; border-radius: 25px; background: var(--option-btn); color: var(--secondary-color);
                        cursor: pointer; box-shadow: 0 6px 0 #98D8E3; transition: all 0.1s; position: relative;
                    }

                    /* Efeito de Clique - O botão "afunda" */
                    button:active { transform: translateY(4px); box-shadow: 0 2px 0 #98D8E3; }

                    /* Feedback de Acerto */
                    .correct { 
                        background-color: var(--correct-color) !important; color: white !important;
                        box-shadow: 0 6px 0 #05A87D !important; animation: bounce 0.5s;
                    }

                    /* Feedback de Erro */
                    .wrong { 
                        background-color: var(--wrong-color) !important; color: white !important;
                        box-shadow: 0 6px 0 #C13959 !important; animation: shake 0.4s;
                    }

                    @keyframes bounce { 0%,100%{transform:scale(1);}50%{transform:scale(1.1);} }
                    @keyframes shake { 0%,100%{transform:translateX(0);}25%{transform:translateX(-10px);}75%{transform:translateX(10px);} }
                </style>
            </head>
            <body>

                <div class="header">
                    <h1>Kitchen Adventure</h1>
                    <p>Qual é o nome deste objeto?</p>
                </div>

                <div class="game-container">
                    <div id="visual-cue" class="word-image">🧊</div>
        
                    <div id="word-display" class="word-text">FRIDGE</div>
        
                    <div class="options-grid" id="options">
                        </div>
                </div>

                <script>
                    // Lista focada nas 5 palavras solicitadas
                    const vocabulary = [
                        { word: "FRIDGE", emoji: "🧊", options: ["FRIDGE", "STOVE", "BED", "TABLE"] },
                        { word: "SPOON", emoji: "🥄", options: ["FORK", "SPOON", "KNIFE", "PLATE"] },
                        { word: "KNIFE", emoji: "🔪", options: ["CUP", "PAN", "KNIFE", "SPOON"] },
                        { word: "PAN", emoji: "🍳", options: ["OVEN", "FRIDGE", "PAN", "BOWL"] },
                        { word: "CUP", emoji: "🥛", options: ["CUP", "FORK", "KNIFE", "PAN"] }
                    ];

                    let currentItem = 0;

                    function loadGame() {
                        const item = vocabulary[currentItem];
                        const visualCue = document.getElementById('visual-cue');
                        const wordDisplay = document.getElementById('word-display');
                        const optionsContainer = document.getElementById('options');

                        // Atualiza visual
                        visualCue.innerText = item.emoji;
                        wordDisplay.innerText = item.word;
                        optionsContainer.innerHTML = '';

                        // Embaralha levemente as opções ou apenas as renderiza
                        item.options.forEach(opt => {
                            const btn = document.createElement('button');
                            btn.innerText = opt;
                            btn.onclick = () => checkAnswer(opt, btn);
                            optionsContainer.appendChild(btn);
                        });
                    }

                    function checkAnswer(selected, btn) {
                        const correct = vocabulary[currentItem].word;
            
                        if(selected === correct) {
                            btn.classList.add('correct');
                            // Pequena pausa para a criança ver que acertou
                            setTimeout(() => {
                                currentItem++;
                                if(currentItem >= vocabulary.length) {
                                    alert("Parabéns! Você conhece tudo na cozinha!");
                                    currentItem = 0; // Reinicia o jogo
                                }
                                loadGame();
                            }, 1000);
                        } else {
                            btn.classList.add('wrong');
                            // Remove a cor de erro após meio segundo para tentar de novo
                            setTimeout(() => btn.classList.remove('wrong'), 500);
                        }
                    }

                    // Inicializa o app
                    loadGame();
                </script>
            </body>
            </html>
            cursor: pointer;
