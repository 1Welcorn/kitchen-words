<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Final - Kitchen Match</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            <!DOCTYPE html>
            <html lang="pt-br">
            <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <title>Kitchen Words - Aprendizado Divertido</title>
                <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700&display=swap" rel="stylesheet">
                <style>
                    :root {
                        --primary-color: #FFD166; /* Amarelo sol */
                        --bg-color: #F0F4F8;      /* Azul acinzentado muito suave */
                        --text-color: #2D3436;
                        --card-bg: #FFFFFF;
                        --correct-color: #06D6A0; /* Verde menta */
                        --wrong-color: #EF476F;   /* Rosa avermelhado */
                    }

                    body {
                        font-family: 'Lexend', sans-serif;
                        background-color: var(--bg-color);
                        color: var(--text-color);
                        display: flex;
                        flex-direction: column;
                        align-items: center;
                        justify-content: center;
                        min-height: 100vh;
                        margin: 0;
                        padding: 20px;
                    }

                    .header {
                        text-align: center;
                        margin-bottom: 20px;
                    }

                    .header h1 {
                        margin: 0;
                        font-size: 2rem;
                        color: #118AB2;
                    }

                    /* Container Principal Centralizado */
                    .game-container {
                        background: var(--card-bg);
                        border-radius: 40px;
                        padding: 40px;
                        box-shadow: 0 15px 35px rgba(0,0,0,0.08);
                        display: flex;
                        flex-direction: column;
                        align-items: center; /* Centraliza tudo horizontalmente */
                        text-align: center;
                        max-width: 450px;
                        width: 100%;
                    }

                    /* Moldura da Imagem Centralizada */
                    .word-image {
                        width: 220px;
                        height: 220px;
                        background: #F8F9FA;
                        margin-bottom: 25px;
                        border-radius: 30px;
                        border: 5px dashed var(--primary-color);
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        font-size: 110px; /* Tamanho do emoji */
                        transition: transform 0.3s ease;
                    }

                    .word-text {
                        font-size: 3.5rem;
                        font-weight: 700;
                        text-transform: uppercase;
                        letter-spacing: 4px;
                        margin-bottom: 30px;
                        color: #073B4C;
                    }

                    /* Grade de Opções */
                    .options-grid {
                        display: grid;
                        grid-template-columns: 1fr 1fr;
                        gap: 15px;
                        width: 100%;
                    }

                    button {
                        padding: 22px 10px;
                        font-family: 'Lexend', sans-serif;
                        font-size: 1.3rem;
                        font-weight: 700;
                        border: none;
                        border-radius: 20px;
                        background: #E5E9F0;
                        color: #4C566A;
                        cursor: pointer;
                        transition: all 0.2s;
                    }

                    button:active {
                        transform: scale(0.95);
                    }

                    /* Feedback Visual */
                    .correct { 
                        background-color: var(--correct-color) !important; 
                        color: white !important;
                        animation: bounce 0.5s;
                    }

                    .wrong { 
                        background-color: var(--wrong-color) !important; 
                        color: white !important;
                        animation: shake 0.4s;
                    }

                    @keyframes bounce {
                        0%, 100% { transform: scale(1); }
                        50% { transform: scale(1.1); }
                    }

                    @keyframes shake {
                        0%, 100% { transform: translateX(0); }
                        25% { transform: translateX(-10px); }
                        75% { transform: translateX(10px); }
                    }
                </style>
            </head>
            <body>

                <div class="header">
                    <h1>Kitchen Adventure</h1>
                    <p>Qual é o nome deste objeto?</p>
                </div>

                <div class="game-container">
                    <div id="visual-cue" class="word-image">🧊</div>
        
                    <div id="word-display" class="word-text">FRIDGE</div>
        
                    <div class="options-grid" id="options">
                        </div>
                </div>

                <script>
                    // Lista focada nas 5 palavras solicitadas
                    const vocabulary = [
                        { word: "FRIDGE", emoji: "🧊", options: ["FRIDGE", "STOVE", "BED", "TABLE"] },
                        { word: "SPOON", emoji: "🥄", options: ["FORK", "SPOON", "KNIFE", "PLATE"] },
                        { word: "KNIFE", emoji: "🔪", options: ["CUP", "PAN", "KNIFE", "SPOON"] },
                        { word: "PAN", emoji: "🍳", options: ["OVEN", "FRIDGE", "PAN", "BOWL"] },
                        { word: "CUP", emoji: "🥛", options: ["CUP", "FORK", "KNIFE", "PAN"] }
                    ];

                    let currentItem = 0;

                    function loadGame() {
                        const item = vocabulary[currentItem];
                        const visualCue = document.getElementById('visual-cue');
                        const wordDisplay = document.getElementById('word-display');
                        const optionsContainer = document.getElementById('options');

                        // Atualiza visual
                        visualCue.innerText = item.emoji;
                        wordDisplay.innerText = item.word;
                        optionsContainer.innerHTML = '';

                        // Embaralha levemente as opções ou apenas as renderiza
                        item.options.forEach(opt => {
                            const btn = document.createElement('button');
                            btn.innerText = opt;
                            btn.onclick = () => checkAnswer(opt, btn);
                            optionsContainer.appendChild(btn);
                        });
                    }

                    function checkAnswer(selected, btn) {
                        const correct = vocabulary[currentItem].word;
            
                        if(selected === correct) {
                            btn.classList.add('correct');
                            // Pequena pausa para a criança ver que acertou
                            setTimeout(() => {
                                currentItem++;
                                if(currentItem >= vocabulary.length) {
                                    alert("Parabéns! Você conhece tudo na cozinha!");
                                    currentItem = 0; // Reinicia o jogo
                                }
                                loadGame();
                            }, 1000);
                        } else {
                            btn.classList.add('wrong');
                            // Remove a cor de erro após meio segundo para tentar de novo
                            setTimeout(() => btn.classList.remove('wrong'), 500);
                        }
                    }

                    // Inicializa o app
                    loadGame();
                </script>
            </body>
            </html>
            cursor: pointer;
