<!-- Cole este seletor de idiomas em um local visível do seu index.html -->
<div class="lang-selector-container" style="display: flex; gap: 8px; justify-content: center; margin: 20px 0;">
  <button class="lang-btn" id="btnPt" onclick="changeHomeLanguage('pt')" style="font-size: 24px; cursor: pointer; background: none; border: none;">🇧🇷 PT</button>
  <button class="lang-btn" id="btnEs" onclick="changeHomeLanguage('es')" style="font-size: 24px; cursor: pointer; background: none; border: none;">🇪🇸 ES</button>
  <button class="lang-btn" id="btnFa" onclick="changeHomeLanguage('fa')" style="font-size: 24px; cursor: pointer; background: none; border: none;">🇦🇫 دری</button>
</div>

<script>
  // Função para mudar o idioma e guardar na memória do navegador
  function changeHomeLanguage(lang) {
    localStorage.setItem('kitchen_words_lang', lang);
    
    // Opcional: Se você quiser traduzir os textos da página inicial dinamicamente
    translateIndexPage(lang);
  }

  function translateIndexPage(lang) {
    const dir = lang === 'fa' ? 'rtl' : 'ltr';
    document.body.setAttribute('dir', dir);
    
    // Aqui você pode adicionar traduções para os botões do index.html se quiser:
    if (lang === 'fa') {
      // Exemplo: document.getElementById('btnStart').textContent = 'شروع بازی';
    } else if (lang === 'es') {
      // Exemplo: document.getElementById('btnStart').textContent = 'Jugar';
    } else {
      // Exemplo: document.getElementById('btnStart').textContent = 'Jogar';
    }
  }

  // Ao carregar a página inicial, verifica se já existe um idioma salvo
  window.addEventListener('DOMContentLoaded', () => {
    const savedLang = localStorage.getItem('kitchen_words_lang') || 'pt';
    changeHomeLanguage(savedLang);
  });
</script>
