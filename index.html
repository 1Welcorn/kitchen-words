<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inglês na minha cozinha</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    :root {
      --blue: #5b7cff;
      --purple: #7f56d9;
      --pink: #e255aa;
      --ok: #1ea971;
      --bg: #f5f8ff;
      --text: #1f2a44;
      --muted: #6b7280
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: Segoe UI, Arial, sans-serif;
      background: linear-gradient(135deg, #eef4ff, #f9fbff);
      color: var(--text)
    }

    .layout {
      max-width: 1400px;
      margin: auto;
      padding: 20px;
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      gap: 20px;
      align-items: start
    }

    .app {
      min-width: 0
    }

    .sidebar {
      background: linear-gradient(180deg, #5b7cff 0%, #6d86ff 100%);
      color: #fff;
      padding: 24px;
      border-radius: 24px;
      box-shadow: 0 14px 30px rgba(74, 92, 196, .18);
      position: sticky;
      top: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px
    }

    .sidebar h1 {
      margin: 0;
      font-size: 32px;
      line-height: 1.1;
      text-align: center;
    }

    .sidebar p {
      margin: 0;
      font-size: 18px;
      line-height: 1.5;
      color: rgba(255, 255, 255, .94);
      text-align: center;
    }

    .sidebar .side-note {
      background: rgba(255, 255, 255, .14);
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 18px;
      padding: 16px;
      font-size: 15px;
      line-height: 1.5;
      text-align: center;
    }

    .app {
      min-width: 0
    }

    .progress {
      margin-top: 15px;
      height: 14px;
      background: #e0e7ff;
      border-radius: 10px;
      overflow: hidden
    }

    .progress div {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #5b7cff, #7f56d9);
      transition: width .35s ease
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
      margin-top: 20px
    }

    .col {
      background: #fff;
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, .08)
    }

    .col h3 {
      margin: 0 0 14px;
      font-size: 24px
    }

    .col.objects {
      border-top: 6px solid var(--blue)
    }

    .col.actions {
      border-top: 6px solid var(--purple)
    }

    .col.translations {
      border-top: 6px solid var(--pink)
    }

    .card {
      background: #f8fbff;
      border: 2px solid #dfe8ff;
      border-radius: 16px;
      padding: 18px;
      cursor: grab;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: .2s;
      font-weight: 700;
      min-height: 120px;
      font-size: 24px;
      user-select: none
    }

    .card:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(91, 124, 255, .08)
    }

    .card.dragging {
      opacity: .4
    }

    .card.done {
      background: #e6fff4;
      border-color: var(--ok)
    }

    .card .art {
      width: 84px;
      height: 84px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background: linear-gradient(180deg, #ffffff, #eef4ff);
      border: 1px solid #dbe6ff;
      flex: 0 0 84px;
      overflow: hidden
    }

    .card .art img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain
    }

    .card .label {
      display: flex;
      flex-direction: column;
      gap: 4px
    }

    .zone {
      border: 2px dashed #cfdcff;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      min-height: 120px;
      height: 120px;
      text-align: center;
      font-size: 18px;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fbfdff;
      transition: .2s
    }

    .zone.filled {
      font-size: 28px;
      font-weight: 800;
      color: var(--text);
      background: #ffffff;
      border-style: solid;
      border-color: #cfdcff;
      padding: 8px
    }

    .zone.filled .card {
      margin: 0;
      width: 100%;
      min-height: 100%;
      height: 100%;
      box-shadow: none;
      cursor: default;
      transform: none
    }

    .zone.filled .card:hover {
      transform: none;
      box-shadow: none
    }

    .zone.active {
      border-color: var(--blue);
      background: #eef4ff
    }

    .zone.reveal {
      font-size: 16px;
      font-weight: 600;
      color: var(--muted);
      background: #fff4fb;
      border-color: #f6c6df
    }

    .zone.reveal.large {
      font-size: 24px;
      font-weight: 800;
      color: var(--pink)
    }

    .status {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      text-align: center;
      font-weight: 800;
      font-size: 18px;
      background: #eef4ff
    }

    .good {
      background: #e6fff4
    }

    .bad {
      background: #ffe6e6
    }

    .btn {
      padding: 14px 18px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #5b7cff, #7f56d9);
      color: #fff;
      cursor: pointer;
      margin-top: 12px;
      font-weight: 800;
      font-size: 18px;
      box-shadow: 0 10px 20px rgba(91, 124, 255, .25);
      transition: all .2s ease;
      letter-spacing: .3px
    }

    .btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 14px 28px rgba(91, 124, 255, .35)
    }

    .btn:active {
      transform: scale(.98)
    }

    .sidebar .btn {
      width: 100%;
      padding: 18px;
      font-size: 20px;
      border-radius: 18px;
      text-align: center
    }

    .sidebar .btn::before {
      content: '▶ ';
      font-size: 18px;
      margin-right: 6px
    }

    .btn:hover {
      filter: brightness(1.05)
    }

    .matched-container {
      margin-top: 18px
    }

    .matched-row {
      display: flex;
      gap: 16px;
      margin-top: 14px;
      opacity: 0;
      transform: translateY(-10px);
      transition: all .45s ease
    }

    .matched-row.show {
      opacity: 1;
      transform: translateY(0)
    }

    .matched-item {
      flex: 1;
      background: #e6fff4;
      border: 2px solid var(--ok);
      border-radius: 16px;
      padding: 14px;
      text-align: center;
      font-weight: 800;
      font-size: 22px;
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .history {
      margin-top: 22px
    }

    .history h4 {
      margin: 0 0 10px;
      font-size: 20px
    }

    @media (max-width:1100px) {
      .layout {
        grid-template-columns: 1fr
      }

      .sidebar {
        position: relative;
        top: auto
      }
    }

    @media (max-width:900px) {
      .grid {
        grid-template-columns: 1fr
      }

      .matched-row {
        flex-direction: column
      }

      .matched-item {
        font-size: 20px
      }
    }
  </style>
</head>

<body>
  <div class="layout">
    <aside class="sidebar">
      <h1>Inglês na minha cozinha 🎮</h1>
      <p>Temos 5 objetos para organizar. Vamos começar com os três primeiros!</p>
      <div class="side-note">Clique nos objetos e nas ações para ouvir o áudio em inglês. Arraste apenas as palavras das
        duas primeiras colunas.</div>
      <button class="btn" id="resetBtnTop" type="button">Iniciar / Reiniciar</button>
    </aside>
    <div class="app">

      <div class="progress">
        <div id="bar"></div>
      </div>

      <div class="grid">
        <div class="col objects">
          <h3>Objetos</h3>
          <div id="objects"></div>
        </div>
        <div class="col actions">
          <h3>Ações</h3>
          <div id="actions"></div>
        </div>
        <div class="col translations">
          <h3>Traduções alinhadas</h3>
          <div id="translations"></div>
        </div>
      </div>

      <div class="matched-container">
        <div id="matchedHistory" class="history"></div>
      </div>

      <div class="status" id="status">Comece arrastando</div>
    </div>
  </div>

  <script>
    const data = [
      { id: 1, obj: 'Knife', act: 'cut', tr: 'cortar', img: 'https://i.ibb.co/9kNp5Fpz/knife.png' },
      { id: 2, obj: 'Pan', act: 'cook', tr: 'cozinhar', img: 'https://i.ibb.co/TMVCmd1s/pan.png' },
      { id: 3, obj: 'Cup', act: 'drink', tr: 'beber', img: 'https://i.ibb.co/5pFpd9n/cup.png' },
      { id: 4, obj: 'Fridge', act: 'open', tr: 'abrir', img: 'https://i.ibb.co/0ygCvPkQ/fridge.png' },
      { id: 5, obj: 'Spoon', act: 'mix', tr: 'misturar', img: 'https://i.ibb.co/v4Jjxfpv/spoon.png' }
    ];

    const dom = {
      bar: document.getElementById('bar'),
      objects: document.getElementById('objects'),
      actions: document.getElementById('actions'),
      translations: document.getElementById('translations'),
      matchedHistory: document.getElementById('matchedHistory'),
      status: document.getElementById('status'),
      resetBtnTop: document.getElementById('resetBtnTop'),
    };

    let gameData = [...data];
    let dragged = null;
    let selectedObject = null;
    let selectedAction = null;
    let score = 0;
    let matchedIds = new Set();
    let currentReveal = null;
    let pendingMatchedItem = null;

    function speak(text) {
      const cleanText = String(text || '').replace(/[^a-zA-Z ]/g, '').trim();
      if (!cleanText) return;
      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.lang = 'en-US';
      utterance.rate = 0.85;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utterance);
    }

    function setStatus(text, ok = null) {
      dom.status.innerHTML = text;
      dom.status.className = 'status' + (ok === null ? '' : ok ? ' good' : ' bad');
    }

    function updateBar() {
      const percent = (score / data.length) * 100;
      dom.bar.style.width = percent + '%';
    }

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function makeCard(text, type, id) {
      const item = data.find(d => d.id === id);
      const el = document.createElement('div');
      el.className = 'card';
      if (matchedIds.has(id)) el.classList.add('done');
      el.draggable = type !== 'translation' && !matchedIds.has(id);
      el.dataset.type = type;
      el.dataset.id = String(id);

      const artBlock = type === 'object' && item
        ? `<div class="art"><img src="${item.img}" alt="${item.obj}"></div>`
        : '';

      el.innerHTML = `${artBlock}<div class="label"><div>${text}</div></div>`;

      if (type !== 'translation' && !matchedIds.has(id)) {
        el.addEventListener('dragstart', () => {
          dragged = { type, id, text };
          el.classList.add('dragging');
        });

        el.addEventListener('dragend', () => {
          el.classList.remove('dragging');
        });
      }

      if (type === 'object' || type === 'action') {
        el.addEventListener('click', () => speak(text));
      }

      return el;
    }

    function makeDisplayCard(type, id) {
      const item = data.find(d => d.id === id);
      if (!item) return document.createElement('div');
      const text = type === 'object' ? item.obj : type === 'action' ? item.act : item.tr;
      const card = makeCard(text, type, id);
      card.draggable = false;
      card.style.cursor = 'default';
      card.classList.remove('dragging');
      return card;
    }

    function makeDropZone(label, expectedType, onMatch) {
      const zone = document.createElement('div');
      zone.className = 'zone';
      zone.textContent = label;

      zone.addEventListener('dragover', (e) => {
        e.preventDefault();
        zone.classList.add('active');
      });

      zone.addEventListener('dragleave', () => {
        zone.classList.remove('active');
      });

      zone.addEventListener('drop', (e) => {
        e.preventDefault();
        zone.classList.remove('active');

        if (!dragged) return;

        if (dragged.type !== expectedType) {
          setStatus('❌ Arraste o tipo correto para aqui.', false);
          dragged = null;
          return;
        }

        onMatch(dragged);
        dragged = null;
      });

      return zone;
    }

    function appendMatchToHistory(item) {
      const history = dom.matchedHistory;

      if (!history.querySelector('h4')) {
        const title = document.createElement('h4');
        title.textContent = 'Pares Completados';
        history.appendChild(title);
      }

      const row = document.createElement('div');
      row.className = 'matched-row show';
      row.innerHTML = `
    <div class="matched-item">${item.obj}</div>
    <div class="matched-item">${item.act}</div>
    <div class="matched-item">${item.tr}</div>
  `;
      history.appendChild(row);
    }

    function finalizePendingMatch() {
      if (!pendingMatchedItem) return;
      appendMatchToHistory(pendingMatchedItem);
      pendingMatchedItem = null;
      if (currentReveal) {
        clearTimeout(currentReveal);
        currentReveal = null;
      }
      render();
    }

    function startPendingMatch(item) {
      if (currentReveal) {
        clearTimeout(currentReveal);
        currentReveal = null;
      }
      pendingMatchedItem = item;
      render(item);
      currentReveal = setTimeout(() => {
        finalizePendingMatch();
      }, 3000);
    }

    function tryCompletePair() {
      if (!selectedObject || !selectedAction) return;

      if (selectedObject.id === selectedAction.id && !matchedIds.has(selectedObject.id)) {
        const item = data.find(d => d.id === selectedObject.id);
        matchedIds.add(item.id);
        score += 1;
        updateBar();
        setStatus(`✔ Muito bem! ${item.obj} → ${item.act}`, true);
        speak(item.act);
        selectedObject = null;
        selectedAction = null;
        startPendingMatch(item);

        if (score === data.length) {
          setTimeout(() => {
            setStatus(`
              <div style="padding: 10px;">
                <div style="font-size: 24px; margin-bottom: 10px;">🎉 PARABÉNS! VOCÊ COMPLETOU A FASE 1!</div>
                <p>Agora você está pronto para o desafio final?</p>
                <a href="quiz.html" class="btn" style="display: block; text-decoration: none; background: linear-gradient(135deg, #e255aa, #ff7eb3);">Ir para o Teste Final 🚀</a>
              </div>
            `, true);
          }, 1200);
        }
      } else {
        setStatus('❌ Par incorreto. Tente uma ação diferente.', false);
        selectedAction = null;
        render();
      }
    }

    function render(lastMatchedItem = null) {
      const { objects, actions, translations } = dom;

      objects.innerHTML = '';
      actions.innerHTML = '';
      translations.innerHTML = '';

      const objectZone = makeDropZone('Arraste o OBJETO aqui', 'object', (item) => {
        if (pendingMatchedItem) {
          finalizePendingMatch();
        }
        if (matchedIds.has(item.id)) return;
        selectedObject = item;
        speak(item.text);
        objectZone.innerHTML = '';
        objectZone.appendChild(makeDisplayCard('object', item.id));
        objectZone.classList.add('filled');
        setStatus(`Objeto selecionado: ${item.text}. Agora arraste a ação correspondente.`, null);
      });

      const actionZone = makeDropZone('Arraste a AÇÃO aqui', 'action', (item) => {
        if (pendingMatchedItem) {
          finalizePendingMatch();
        }
        if (matchedIds.has(item.id)) return;
        selectedAction = item;
        speak(item.text);
        actionZone.innerHTML = '';
        actionZone.appendChild(makeDisplayCard('action', item.id));
        actionZone.classList.add('filled');
        translationZone.innerHTML = '';
        translationZone.appendChild(makeDisplayCard('translation', item.id));
        translationZone.classList.add('filled', 'large');
        setStatus(`Ação selecionada: ${item.text}. Use a tradução como apoio visual.`, null);
        tryCompletePair();
      });

      const translationZone = document.createElement('div');
      translationZone.className = 'zone reveal';

      if (lastMatchedItem) {
        objectZone.innerHTML = '';
        objectZone.appendChild(makeDisplayCard('object', lastMatchedItem.id));
        objectZone.classList.add('filled');

        actionZone.innerHTML = '';
        actionZone.appendChild(makeDisplayCard('action', lastMatchedItem.id));
        actionZone.classList.add('filled');

        translationZone.classList.add('filled', 'large');
        translationZone.innerHTML = '';
        translationZone.appendChild(makeDisplayCard('translation', lastMatchedItem.id));
      } else if (selectedObject) {
        objectZone.innerHTML = '';
        objectZone.appendChild(makeDisplayCard('object', selectedObject.id));
        objectZone.classList.add('filled');
        translationZone.textContent = 'A tradução fica alinhada com a ação';
      } else {
        translationZone.textContent = 'A tradução fica alinhada com a ação';
      }

      objects.appendChild(objectZone);
      actions.appendChild(actionZone);
      translations.appendChild(translationZone);

      const availableItems = gameData.filter(item => !matchedIds.has(item.id));
      const visibleItems = availableItems.slice(0, 3);
      
      const objectsToRender = shuffle(visibleItems);
      const actionsToRender = shuffle(visibleItems);

      objectsToRender.forEach(item => {
        objects.appendChild(makeCard(item.obj, 'object', item.id));
      });

      actionsToRender.forEach(item => {
        actions.appendChild(makeCard(item.act, 'action', item.id));

        const translationCard = makeCard(item.tr, 'translation', item.id);
        translationCard.style.cursor = 'default';
        translations.appendChild(translationCard);
      });
    }

    function resetGame() {
      if (currentReveal) {
        clearTimeout(currentReveal);
        currentReveal = null;
      }
      pendingMatchedItem = null;
      dragged = null;
      selectedObject = null;
      selectedAction = null;
      score = 0;
      matchedIds = new Set();
      gameData = shuffle(data);
      dom.matchedHistory.innerHTML = '';
      updateBar();
      setStatus('Comece arrastando', null);
      render();
    }

    dom.resetBtnTop.addEventListener('click', resetGame);
    updateBar();
    render();
  </script>
</body>

</html>
