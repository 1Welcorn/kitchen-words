<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inglês na minha cozinha</title>
  <style>
    :root {
      --blue: #5b7cff;
      --purple: #7f56d9;
      --pink: #e255aa;
      --ok: #1ea971;
      --bg: #f5f8ff;
      --text: #1f2a44;
      --muted: #6b7280
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: Segoe UI, Arial, sans-serif;
      background: linear-gradient(135deg, #eef4ff, #f9fbff);
      color: var(--text)
    }

    .layout {
      max-width: 1400px;
      margin: auto;
      padding: 20px;
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      gap: 20px;
      align-items: start
    }

    .app {
      min-width: 0
    }

    .sidebar {
      background: linear-gradient(180deg, #5b7cff 0%, #6d86ff 100%);
      color: #fff;
      padding: 24px;
      border-radius: 24px;
      box-shadow: 0 14px 30px rgba(74, 92, 196, .18);
      position: sticky;
      top: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px
    }

    .sidebar h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.05;
      text-align: left;
    }

    .sidebar p {
      margin: 0;
      font-size: 18px;
      line-height: 1.5;
      color: rgba(255, 255, 255, .94);
      text-align: left;
    }

    .sidebar .side-note {
      background: rgba(255, 255, 255, .2);
      border: 1px solid rgba(255, 255, 255, .3);
      border-radius: 18px;
      padding: 20px;
      font-size: 15px;
      line-height: 1.5;
      text-align: left;
    }

    .app {
      min-width: 0
    }

    .progress {
      margin-top: 15px;
      height: 14px;
      background: #e0e7ff;
      border-radius: 10px;
      overflow: hidden
    }

    .progress div {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #5b7cff, #7f56d9);
      transition: width .35s ease
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
      margin-top: 20px
    }

    .col {
      background: #fff;
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, .08)
    }

    .col h3 {
      margin: 0 0 20px;
      font-size: 24px;
      font-weight: 800;
      color: #1f2a44;
      padding-top: 10px;
    }

    .col.objects { border-top: 5px solid #5b7cff; border-radius: 12px 12px 0 0; }
    .col.actions { border-top: 5px solid #7f56d9; border-radius: 12px 12px 0 0; }
    .col.translations { border-top: 5px solid #e255aa; border-radius: 12px 12px 0 0; }

    .card {
      background: linear-gradient(145deg, #ffffff, #f0f4ff);
      border: 1px solid #d0daff;
      border-radius: 24px;
      padding: 20px;
      cursor: grab;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-weight: 700;
      min-height: 120px;
      font-size: 24px;
      user-select: none;
      box-shadow: 0 4px 12px rgba(91, 124, 255, 0.05);
    }

    .card:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(91, 124, 255, .08)
    }

    .card.dragging {
      opacity: .4
    }

    .card.done {
      background: #e6fff4;
      border-color: var(--ok)
    }

    .card .art {
      width: 90px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      background: #fff;
      border: 1px solid #e0e7ff;
      flex: 0 0 90px;
      overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
    }

    .card .art img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain
    }

    .card .label {
      display: flex;
      flex-direction: column;
      gap: 4px
    }

    .zone {
      border: 2px dashed #cfdcff;
      border-radius: 24px;
      padding: 16px;
      margin-bottom: 16px;
      min-height: 130px;
      height: 130px;
      text-align: center;
      font-size: 18px;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(245, 248, 255, 0.5);
      transition: all 0.3s ease;
    }

    .zone.filled {
      font-size: 28px;
      font-weight: 800;
      color: var(--text);
      background: #ffffff;
      border-style: solid;
      border-color: #cfdcff;
      padding: 8px
    }

    .zone.filled .card {
      margin: 0;
      width: 100%;
      min-height: 100%;
      height: 100%;
      box-shadow: none;
      cursor: default;
      transform: none
    }

    .zone.filled .card:hover {
      transform: none;
      box-shadow: none
    }

    .zone.active {
      border-color: var(--blue);
      background: #eef4ff
    }

    .zone.reveal {
      font-size: 16px;
      font-weight: 600;
      color: var(--muted);
      background: #fff4fb;
      border-color: #f6c6df
    }

    .zone.reveal.large {
      font-size: 24px;
      font-weight: 800;
      color: var(--pink)
    }

    .status {
      margin-top: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      text-align: center;
      font-weight: 800;
      font-size: 18px;
      background: #eef4ff;
      transition: all 0.3s ease;
    }

    .good {
      background: #e6fff4;
      border: 1px solid var(--ok);
    }

    @keyframes pulse-bad {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); box-shadow: 0 0 20px rgba(255, 0, 0, 0.15); }
      100% { transform: scale(1); }
    }

    .bad {
      background: #ffe6e6;
      border: 1px solid #ffb3b3;
      color: #d32f2f;
      animation: pulse-bad 0.4s ease-in-out 4;
    }

    .btn {
      background: linear-gradient(135deg, #6366f1, #818cf8);
      color: #fff;
      border: none;
      padding: 18px 24px;
      border-radius: 18px;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(0, 0, 0, .1);
      transition: .2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 14px 28px rgba(91, 124, 255, .35)
    }

    .btn:active {
      transform: scale(.98)
    }

    .sidebar .btn {
      width: 100%;
      padding: 18px;
      font-size: 20px;
      border-radius: 18px;
      text-align: center
    }

    .sidebar .btn::before {
      content: '▶ ';
      font-size: 18px;
      margin-right: 6px
    }

    .btn:hover {
      filter: brightness(1.05)
    }

    .matched-container {
      margin-top: 18px
    }

    .matched-row {
      display: flex;
      gap: 16px;
      margin-top: 14px;
      opacity: 0;
      transform: translateY(-10px);
      transition: all .45s ease
    }

    .matched-row.show {
      opacity: 1;
      transform: translateY(0)
    }

    .matched-item {
      flex: 1;
      background: #e6fff4;
      border: 2px solid var(--ok);
      border-radius: 16px;
      padding: 14px;
      text-align: center;
      font-weight: 800;
      font-size: 22px;
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .history {
      margin-top: 22px
    }

    .history h4 {
      margin: 0 0 10px;
      font-size: 20px
    }

    @media (max-width:1100px) {
      .layout {
        grid-template-columns: 1fr
      }

      .sidebar {
        position: relative;
        top: auto
      }
    }

    @media (max-width:900px) {
      .grid {
        grid-template-columns: 1fr
      }

      .matched-row {
        flex-direction: column
      }

      .matched-item {
        font-size: 20px
      }
    }
  </style>
</head>

<body>
  <div class="layout">
    <aside class="sidebar">
      <h1>Kitchen Match ULTRA 🎮</h1>
      <p>Organize apenas <strong>objeto → ação</strong>. A terceira coluna já fica alinhada com as ações para dar suporte visual.</p>
      <div class="side-note">Clique nos objetos e nas ações para ouvir o áudio em inglês. Arraste apenas as palavras das
        duas primeiras colunas.</div>
    </aside>
    <div class="app">

      <div class="progress">
        <div id="bar"></div>
      </div>

      <div class="grid">
        <div class="col objects">
          <h3>Objetos</h3>
          <div id="objects"></div>
        </div>
        <div class="col actions">
          <h3>Ações</h3>
          <div id="actions"></div>
        </div>
        <div class="col translations">
          <h3>Traduções alinhadas</h3>
          <div id="translations"></div>
        </div>
      </div>

      <div class="matched-container">
        <div id="matchedHistory" class="history"></div>
      </div>

    </div>
  </div>

  <script>
    const data = [
      { id: 1, obj: 'Knife', act: 'cut', tr: 'cortar', img: 'https://i.ibb.co/9kNp5Fpz/knife.png' },
      { id: 2, obj: 'Pan', act: 'cook', tr: 'cozinhar', img: 'https://i.ibb.co/TMVCmd1s/pan.png' },
      { id: 3, obj: 'Cup', act: 'drink', tr: 'beber', img: 'https://i.ibb.co/5pFpd9n/cup.png' },
      { id: 4, obj: 'Fridge', act: 'open', tr: 'abrir', img: 'https://i.ibb.co/0ygCvPkQ/fridge.png' },
      { id: 5, obj: 'Spoon', act: 'mix', tr: 'misturar', img: 'https://i.ibb.co/v4Jjxfpv/spoon.png' }
    ];

    const dom = {
      bar: document.getElementById('bar'),
      objects: document.getElementById('objects'),
      actions: document.getElementById('actions'),
      translations: document.getElementById('translations'),
      matchedHistory: document.getElementById('matchedHistory'),
    };

    let gameData = [...data];
    let dragged = null;
    let selectedObject = null;
    let selectedAction = null;
    let score = 0;
    let matchedIds = new Set();
    let currentReveal = null;
    let pendingMatchedItem = null;

    function speak(text, onEnd = null) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      const voices = window.speechSynthesis.getVoices();
      
      const isPT = /[áàâãéèêíïóôõöúç]/i.test(text) || 
                   /\b(Tente|mais|vez|Parabéns|Muito|bem|Objeto|Ação|Isso|mesmo|Pronto|Fase)\b/i.test(text);

      if (isPT) {
        utterance.lang = 'pt-BR';
        utterance.voice = voices.find(v => v.lang === 'pt-BR') || 
                          voices.find(v => v.lang.includes('pt')) ||
                          voices.find(v => v.name.includes('Daniel') || v.name.includes('Maria'));
        utterance.rate = 1.0;
      } else {
        utterance.lang = 'en-US';
        utterance.voice = voices.find(v => v.name.includes('Samantha') || v.name.includes('Google US English') || (v.name.includes('Natural') && v.lang.includes('en-US'))) 
                          || voices.find(v => v.lang === 'en-US') || voices.find(v => v.lang.includes('en'));
        utterance.rate = 0.8;
      }
      
      if (onEnd) utterance.onend = onEnd;
      window.speechSynthesis.speak(utterance);
    }

    function setStatus(text, ok = null) {
      // Status bar removed
    }

    function updateBar() {
      const percent = (score / data.length) * 100;
      dom.bar.style.width = percent + '%';
    }

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function makeCard(text, type, id) {
      const item = data.find(d => d.id === id);
      const el = document.createElement('div');
      el.className = 'card';
      if (matchedIds.has(id)) el.classList.add('done');
      el.draggable = type !== 'translation' && !matchedIds.has(id);
      el.dataset.type = type;
      el.dataset.id = String(id);

      const artBlock = type === 'object' && item
        ? `<div class="art"><img src="${item.img}" alt="${item.obj}"></div>`
        : '';

      el.innerHTML = `${artBlock}<div class="label"><div>${text}</div></div>`;

      if (type !== 'translation' && !matchedIds.has(id)) {
        el.addEventListener('dragstart', () => {
          dragged = { type, id, text };
          el.classList.add('dragging');
        });

        el.addEventListener('dragend', () => {
          el.classList.remove('dragging');
        });
      }

      if (type === 'object' || type === 'action') {
        el.addEventListener('click', () => speak(text));
      }

      return el;
    }

    function makeDisplayCard(type, id) {
      const item = data.find(d => d.id === id);
      if (!item) return document.createElement('div');
      const text = type === 'object' ? item.obj : type === 'action' ? item.act : item.tr;
      const card = makeCard(text, type, id);
      card.draggable = false;
      card.style.cursor = 'default';
      card.classList.remove('dragging');
      return card;
    }

    function makeDropZone(label, expectedType, onMatch) {
      const zone = document.createElement('div');
      zone.className = 'zone';
      zone.textContent = label;

      zone.addEventListener('dragover', (e) => {
        e.preventDefault();
        zone.classList.add('active');
      });

      zone.addEventListener('dragleave', () => {
        zone.classList.remove('active');
      });

      zone.addEventListener('drop', (e) => {
        e.preventDefault();
        zone.classList.remove('active');

        if (!dragged) return;

        if (dragged.type !== expectedType) {
          setStatus('❌ Arraste o tipo correto para aqui.', false);
          dragged = null;
          return;
        }

        onMatch(dragged);
        dragged = null;
      });

      return zone;
    }

    function appendMatchToHistory(item) {
      const history = dom.matchedHistory;

      if (!history.querySelector('h4')) {
        const title = document.createElement('h4');
        title.textContent = 'Pares Completados';
        history.appendChild(title);
      }

      const row = document.createElement('div');
      row.className = 'matched-row show';
      row.innerHTML = `
    <div class="matched-item">${item.obj}</div>
    <div class="matched-item">${item.act}</div>
    <div class="matched-item">${item.tr}</div>
  `;
      history.appendChild(row);
    }

    function finalizePendingMatch() {
      if (!pendingMatchedItem) return;
      appendMatchToHistory(pendingMatchedItem);
      pendingMatchedItem = null;
      if (currentReveal) {
        clearTimeout(currentReveal);
        currentReveal = null;
      }
      render();
    }

    function startPendingMatch(item) {
      if (currentReveal) {
        clearTimeout(currentReveal);
        currentReveal = null;
      }
      pendingMatchedItem = item;
      render(item);
      currentReveal = setTimeout(() => {
        finalizePendingMatch();
      }, 3000);
    }

    function tryCompletePair() {
      if (!selectedObject || !selectedAction) return;

      if (selectedObject.id === selectedAction.id && !matchedIds.has(selectedObject.id)) {
        const item = data.find(d => d.id === selectedObject.id);
        matchedIds.add(item.id);
        score += 1;
        updateBar();
        setStatus(`✔ Muito bem! ${item.obj} → ${item.act}`, true);
        speak("Muito bem!");
        selectedObject = null;
        selectedAction = null;
        startPendingMatch(item);

        if (score === data.length) {
          setTimeout(() => {
            setStatus(`
              <div style="padding: 10px;">
                <div style="font-size: 24px; margin-bottom: 10px;">🎉 PARABÉNS! VOCÊ COMPLETOU A FASE 1!</div>
                <p>Agora você está pronto para o desafio final?</p>
                <a href="quiz.html" class="btn" style="display: block; text-decoration: none; background: linear-gradient(135deg, #e255aa, #ff7eb3);">Ir para o Teste Final 🚀</a>
              </div>
            `, true);
          }, 1200);
        }
      } else {
        const wrongMsg = Math.random() > 0.5 ? "Try again" : "Tente mais uma vez";
        speak(wrongMsg);
        setStatus(`❌ Par incorreto. ${wrongMsg === 'Try again' ? 'Tente de novo' : wrongMsg}.`, false);
        selectedAction = null;
        render();
      }
    }

    function render(lastMatchedItem = null) {
      const { objects, actions, translations } = dom;

      objects.innerHTML = '';
      actions.innerHTML = '';
      translations.innerHTML = '';

      const objectZone = makeDropZone('Arraste o OBJETO aqui', 'object', (item) => {
        if (pendingMatchedItem) {
          finalizePendingMatch();
        }
        if (matchedIds.has(item.id)) return;
        selectedObject = item;
        speak(item.text);
        objectZone.innerHTML = '';
        objectZone.appendChild(makeDisplayCard('object', item.id));
        objectZone.classList.add('filled');
        setStatus(`Objeto selecionado: ${item.text}. Agora arraste a ação correspondente.`, null);
      });

      const actionZone = makeDropZone('Arraste a AÇÃO aqui', 'action', (item) => {
        if (pendingMatchedItem) {
          finalizePendingMatch();
        }
        if (matchedIds.has(item.id)) return;
        selectedAction = item;
        speak(item.text);
        actionZone.innerHTML = '';
        actionZone.appendChild(makeDisplayCard('action', item.id));
        actionZone.classList.add('filled');
        translationZone.innerHTML = '';
        translationZone.appendChild(makeDisplayCard('translation', item.id));
        translationZone.classList.add('filled', 'large');
        setStatus(`Ação selecionada: ${item.text}. Use a tradução como apoio visual.`, null);
        tryCompletePair();
      });

      const translationZone = document.createElement('div');
      translationZone.className = 'zone reveal';

      if (lastMatchedItem) {
        objectZone.innerHTML = '';
        objectZone.appendChild(makeDisplayCard('object', lastMatchedItem.id));
        objectZone.classList.add('filled');

        actionZone.innerHTML = '';
        actionZone.appendChild(makeDisplayCard('action', lastMatchedItem.id));
        actionZone.classList.add('filled');

        translationZone.classList.add('filled', 'large');
        translationZone.innerHTML = '';
        translationZone.appendChild(makeDisplayCard('translation', lastMatchedItem.id));
      } else if (selectedObject) {
        objectZone.innerHTML = '';
        objectZone.appendChild(makeDisplayCard('object', selectedObject.id));
        objectZone.classList.add('filled');
        translationZone.textContent = 'A tradução fica alinhada com a ação';
      } else {
        translationZone.textContent = 'A tradução fica alinhada com a ação';
      }

      objects.appendChild(objectZone);
      actions.appendChild(actionZone);
      translations.appendChild(translationZone);

      const availableItems = gameData.filter(item => !matchedIds.has(item.id));
      const visibleItems = availableItems.slice(0, 3);
      
      const objectsToRender = shuffle(visibleItems);
      const actionsToRender = shuffle(visibleItems);

      objectsToRender.forEach(item => {
        objects.appendChild(makeCard(item.obj, 'object', item.id));
      });

      actionsToRender.forEach(item => {
        actions.appendChild(makeCard(item.act, 'action', item.id));

        const translationCard = makeCard(item.tr, 'translation', item.id);
        translationCard.style.cursor = 'default';
        translations.appendChild(translationCard);
      });
    }

    function resetGame() {
      if (currentReveal) {
        clearTimeout(currentReveal);
        currentReveal = null;
      }
      pendingMatchedItem = null;
      dragged = null;
      selectedObject = null;
      selectedAction = null;
      score = 0;
      matchedIds = new Set();
      gameData = shuffle(data);
      dom.matchedHistory.innerHTML = '';
      updateBar();
      setStatus('Comece arrastando', null);
      render();
    }

    resetGame();
  </script>
</body>

</html>
