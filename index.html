<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cozinha em Inglês — Menu</title>
  <link rel="icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Caveat:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream:    #FFF6E5;
      --cream-2:  #FFEFD0;
      --ink:      #2B2541;
      --ink-soft: #5A5170;
      --teal:     #2EC4B6;
      --teal-dk:  #1FA89B;
      --coral:    #FF6B6B;
      --coral-dk: #E84F4F;
      --yellow:   #FFD166;
      --yellow-dk: #E8B848;
      --lilac:    #B8A1FF;
      --lilac-dk: #9A82E6;
      --green:    #06D6A0;
      --green-dk: #04B084;
      --shadow:   0 10px 0 rgba(43, 37, 65, 0.18);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Fredoka', system-ui, sans-serif;
      font-weight: 500;
      color: var(--ink);
      background:
        radial-gradient(circle at 80% 10%, rgba(255, 209, 102, 0.25), transparent 40%),
        radial-gradient(circle at 10% 90%, rgba(184, 161, 255, 0.22), transparent 40%),
        radial-gradient(circle at 50% 50%, var(--cream-2) 0%, var(--cream) 70%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .deco {
      position: fixed;
      pointer-events: none;
      opacity: 0.45;
      z-index: 0;
    }
    .deco-1 { top: 12%; left: 6%; font-size: 42px; animation: float 8s ease-in-out infinite; }
    .deco-2 { top: 25%; right: 6%; font-size: 48px; animation: float 7s ease-in-out infinite -2s; }
    .deco-3 { bottom: 12%; left: 9%; font-size: 44px; animation: float 9s ease-in-out infinite -4s; }
    .deco-4 { bottom: 18%; right: 8%; font-size: 38px; animation: float 6.5s ease-in-out infinite -1s; }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-5deg); }
      50%      { transform: translateY(-16px) rotate(5deg); }
    }

    /* Container do Menu Principal Repaginado */
    .menu-card {
      background: #fff;
      border: 6px solid var(--ink);
      border-radius: 48px;
      padding: 50px 40px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: var(--shadow);
      position: relative;
      z-index: 2;
    }

    .logo-container {
      position: relative;
      display: inline-block;
      margin-bottom: 24px;
    }
    .logo-img {
      width: 120px;
      height: 120px;
      border: 5px solid var(--ink);
      border-radius: 32px;
      box-shadow: 0 8px 0 rgba(43, 37, 65, 0.15);
      background: #fff;
      transform: rotate(-3deg);
      transition: transform 0.3s ease;
    }
    .menu-card:hover .logo-img {
      transform: rotate(3deg) scale(1.05);
    }

    h1 {
      font-weight: 700;
      font-size: 42px;
      margin: 0 0 8px;
      color: var(--ink);
      line-height: 1.1;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-family: 'Caveat', cursive;
      font-size: 28px;
      font-weight: 700;
      color: var(--lilac-dk);
      margin: 0 0 24px;
    }

    p {
      font-size: 19px;
      color: var(--ink-soft);
      line-height: 1.5;
      margin: 0 0 35px;
      font-weight: 500;
    }

    /* Botão Iniciar Premium (Estilo Cartoon Lúdico 3D) */
    .btn-play {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 22px 30px;
      background: linear-gradient(135deg, #06D6A0 0%, #04B084 100%);
      color: #fff;
      border: 5px solid var(--ink);
      border-radius: 28px;
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: 26px;
      cursor: pointer;
      box-shadow: 0 10px 0 var(--ink);
      text-decoration: none;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
      position: relative;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      animation: pulseBtn 2s infinite ease-in-out;
    }
    .btn-play:hover {
      background: linear-gradient(135deg, #07e2aa 0%, #04be90 100%);
    }
    .btn-play:active {
      transform: translateY(8px);
      box-shadow: 0 2px 0 var(--ink);
    }

    @keyframes pulseBtn {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    @media (max-width: 520px) {
      .menu-card { padding: 35px 20px; border-radius: 36px; }
      h1 { font-size: 32px; }
      .btn-play { font-size: 22px; padding: 18px 20px; }
      .deco { display: none; }
    }
  </style>
</head>
<body>
  <div class="deco deco-1">⭐</div>
  <div class="deco deco-2">🍳</div>
  <div class="deco deco-3">🥄</div>
  <div class="deco deco-4">🍴</div>

  <main class="menu-card">
    <div class="logo-container">
      <img class="logo-img" src="favicon.png" alt="Logo">
    </div>
    
    <h1 id="homeTitle">Cozinha em Inglês</h1>
    <div class="subtitle" id="homeSubtitle">Fase 2 — Verbos e Ações</div>
    
    <p id="homeDesc">Combine as imagens aos blocos de ação em inglês e veja as frases se completarem magicamente!</p>

    <!-- Botão de Iniciar Estilizado -->
    <a href="quiz.html" class="btn-play" id="btnStart">
      <span>Jogar Agora</span> 🚀
    </a>
  </main>
</body>
</html>
